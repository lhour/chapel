[package]
name = "chapel"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", default-features = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Compile bevy fixtures fast enough to actually run.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1